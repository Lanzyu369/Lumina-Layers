name: Build wheels

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: windows-amd64
            runner: windows-2022
            build: cp312-win_amd64
          - id: macos-arm64
            runner: macos-15
            build: cp312-macosx_arm64
          - id: macos-x86_64
            runner: macos-15-intel
            build: cp312-macosx_x86_64
    env:
      CIBW_BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and exercise the Linux host wheel
        if: runner.os == 'Linux'
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
          python tools/verify_wheel.py wheelhouse/*.whl --contents-only
          python -m pip install wheelhouse/*.whl pytest "shapely>=2,<3"
          python tools/verify_wheel.py --installed
          python -m pytest tests -q
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        if: runner.os != 'Linux'
        with:
          package-dir: .
          output-dir: wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumina-svg-core-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error
