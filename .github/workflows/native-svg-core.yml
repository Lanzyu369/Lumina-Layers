name: Native SVG core wheels

on:
  pull_request:
    branches: [dev-refactor, main]
    paths:
      - "native/lumina-svg-core/**"
      - ".github/workflows/native-svg-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: manylinux-x86_64
            runner: ubuntu-24.04
            build: cp312-manylinux_x86_64
          - id: windows-amd64
            runner: windows-2022
            build: cp312-win_amd64
          - id: macos-arm64
            runner: macos-15
            build: cp312-macosx_arm64
          - id: macos-x86_64
            runner: macos-15-intel
            build: cp312-macosx_x86_64
    env:
      CIBW_BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: native/lumina-svg-core
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-svg-core-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error
