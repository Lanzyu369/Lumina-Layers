name: Native SVG core wheels

on:
  pull_request:
    branches: [dev-refactor, main]
    paths:
      - "native/lumina-svg-core/**"
      - "core/**"
      - "api/**"
      - "utils/bambu_3mf_writer.py"
      - "tests/fixtures/native_svg/**"
      - "tests/test_native_svg_*.py"
      - "scripts/benchmark_native_svg_analysis.py"
      - "scripts/build_native_svg_supported_fixture.py"
      - "scripts/verify_native_svg_slicer_outputs.py"
      - "docs/native-svg-fast-path-validation.md"
      - "progress/native-svg-fast-path-benchmark.json"
      - "progress/native-svg-slicer-reality.json"
      - "requirements-native-svg.txt"
      - "requirements.txt"
      - "requirements-glb-v2.txt"
      - "requirements-3mf-native.txt"
      - "scripts/build_3mf_native_wheels.py"
      - ".github/actions/prepare-3mf-native-wheels/**"
      - "api_server.py"
      - ".github/workflows/native-svg-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: windows-amd64
            runner: windows-2022
            build: cp312-win_amd64
          - id: macos-arm64
            runner: macos-15
            build: cp312-macosx_arm64
          - id: macos-x86_64
            runner: macos-15-intel
            build: cp312-macosx_x86_64
    env:
      CIBW_BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the Linux host wheel
        if: runner.os == 'Linux'
        run: |
          python -m pip wheel ./native/lumina-svg-core --no-deps --wheel-dir wheelhouse
          python native/lumina-svg-core/tools/verify_wheel.py wheelhouse/*.whl --contents-only
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        if: runner.os != 'Linux'
        with:
          package-dir: native/lumina-svg-core
          output-dir: wheelhouse
      - name: Install and exercise the wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall wheelhouse/*.whl pytest "shapely>=2,<3"
          python -m pip install \
            "scikit-build-core==1.0.3" \
            "pybind11==3.1.0" \
            "numpy==2.5.2" \
            "cmake==4.3.4" \
            "ninja==1.13.2"
          python native/lumina-svg-core/tools/verify_wheel.py --installed
          (cd native/lumina-svg-core && LUMINA_SVG_REPLAY_THREADS=4 python -m pytest tests -q)
          PYTHON_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          PYBIND11_DIR="$(python -m pybind11 --cmakedir)"
          python - <<'PY'
          import shutil
          import subprocess
          for name in ("cmake", "ninja"):
              path = shutil.which(name)
              if not path:
                  raise SystemExit(f"missing host build executable: {name}")
              print(f"{name}={path}")
              subprocess.run([name, "--version"], check=True)
          print("python=" + __import__("sys").executable)
          print("pybind11_cmake=" + subprocess.check_output(
              [__import__("sys").executable, "-m", "pybind11", "--cmakedir"],
              text=True,
          ).strip())
          PY
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S native/lumina-svg-core -B native-svg-canonical-regression \
              -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DPython_EXECUTABLE="$PYTHON_EXECUTABLE" \
              -Dpybind11_DIR="$PYBIND11_DIR"
            cmake --build native-svg-canonical-regression --config Release \
              --target lumina_svg_canonical_predicates_regression
            ctest --test-dir native-svg-canonical-regression -C Release \
              --output-on-failure --no-tests=error \
              -R lumina_svg_canonical_predicates_regression
          else
            cmake -S native/lumina-svg-core -B native-svg-canonical-regression \
              -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release \
              -DPython_EXECUTABLE="$PYTHON_EXECUTABLE" \
              -Dpybind11_DIR="$PYBIND11_DIR"
            cmake --build native-svg-canonical-regression \
              --target lumina_svg_canonical_predicates_regression
            ctest --test-dir native-svg-canonical-regression \
              --output-on-failure --no-tests=error \
              -R lumina_svg_canonical_predicates_regression
          fi
          python - <<'PY'
          from pathlib import Path
          import lumina_svg_core

          fixture = Path("native/lumina-svg-core/tests/fixtures/fill_rules_transforms.svg")
          result = lumina_svg_core.analyze_svg(fixture, 111.0, 0.02)
          assert result.status == "supported", result.reason_code
          assert result.raw.geometry_count > 0
          assert result.visible.geometry_count > 0
          assert result.silhouette.geometry_count == 1
          print(lumina_svg_core.__version__, result.visible.geometry_count)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumina-svg-core-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  product-artifacts:
    name: product-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-glb-v2.txt
            requirements-3mf-native.txt
      - name: Prepare native 3MF wheelhouse
        uses: ./.github/actions/prepare-3mf-native-wheels
      - name: Install Lumina test dependencies
        run: >-
          python -m pip install
          -r requirements-dev.txt
          -r requirements-glb-v2.txt
      - name: Exercise native product workflows
        env:
          LUMINA_SVG_REPLAY_THREADS: "4"
        run: >-
          python -m pytest
          tests/test_native_svg_adapter_unit.py
          tests/test_native_svg_benchmark_contract_unit.py
          tests/test_native_svg_differential_unit.py
          tests/test_native_svg_fallback_properties.py
          tests/test_native_svg_workflow_integration.py
          tests/test_native_svg_packaging_contract_unit.py
          tests/test_vector_native_svg_selection_unit.py
          tests/test_svg_hole_compensation_unit.py
          tests/test_svg_compensation_analysis_unit.py
          tests/test_svg_compensation_transport_unit.py
          tests/test_svg_compensation_packaging_unit.py
          -q
      - name: Generate representative GLB and 3MF artifacts
        run: >-
          python scripts/verify_native_svg_slicer_outputs.py
          --generate-only
          --artifact-dir native-svg-reality
          --report native-svg-reality/generation-report.json
      - name: Record unavailable hosted-runner slicer boundary
        shell: bash
        run: |
          set +e
          python scripts/verify_native_svg_slicer_outputs.py \
            --no-auto-detect \
            --artifact-dir native-svg-reality \
            --bambu-3mf native-svg-reality/native-svg-BambuStudio.3mf \
            --orca-3mf native-svg-reality/native-svg-OrcaSlicer.3mf \
            --report native-svg-reality/hosted-runner-slicer-report.json
          reality_exit=$?
          set -e
          if [ "$reality_exit" -ne 20 ]; then
            echo "Expected reality_dependency_unavailable (20), got $reality_exit"
            exit 1
          fi
      - name: Measure the complete public VectorAnalysis path
        run: >-
          python scripts/benchmark_native_svg_analysis.py
          --large-search-root workspace=${{ github.workspace }}
          --output native-svg-reality/public-entry-benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumina-native-svg-reality
          path: native-svg-reality/
          if-no-files-found: error
