name: Publish immutable Workshop SDK

on:
  push:
    tags:
      - "workshop-sdk-v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish exact SDK asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workshop-sdk/pnpm-lock.yaml

      - name: Validate tag identity
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION="$(node -p "require('./workshop-sdk/package.json').version")"
          EXPECTED_TAG="workshop-sdk-v${SDK_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Expected tag ${EXPECTED_TAG}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "SDK_VERSION=${SDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install locked SDK dependencies
        shell: bash
        run: pnpm --dir workshop-sdk install --frozen-lockfile

      - name: Install release-contract test dependencies
        shell: bash
        run: >-
          python -m pip install
          "pytest==8.4.2"
          "hypothesis==6.152.4"

      - name: Test and pack SDK exactly once
        shell: bash
        run: pnpm --dir workshop-sdk run pack:release

      - name: Verify SDK release contract
        shell: bash
        run: >-
          LUMINA_WORKSHOP_SDK_USE_EXISTING_TARBALL=1
          python -m pytest
          tests/test_workshop_sdk_release_contract_unit.py -v

      - name: Verify generated files did not change tracked source
        shell: bash
        run: |
          set -euo pipefail
          TRACKED_CHANGES="$(git status --short --untracked-files=no)"
          if [[ -n "${TRACKED_CHANGES}" ]]; then
            echo "${TRACKED_CHANGES}" >&2
            exit 1
          fi

      - name: Create lowercase SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd workshop-sdk/dist-package
          TARBALL="lumina-workshop-sdk-${SDK_VERSION}.tgz"
          CHECKSUM="lumina-workshop-sdk-${SDK_VERSION}.tgz.sha256"
          test -f "${TARBALL}"
          sha256sum "${TARBALL}" > "${CHECKSUM}"
          grep -Eq '^[0-9a-f]{64}  lumina-workshop-sdk-[0-9]+\.[0-9]+\.[0-9]+\.tgz$' \
            "${CHECKSUM}"

      - name: Publish exact GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="workshop-sdk-v${SDK_VERSION}"
          ASSET_DIR="workshop-sdk/dist-package"
          TARBALL="${ASSET_DIR}/lumina-workshop-sdk-${SDK_VERSION}.tgz"
          CHECKSUM="${ASSET_DIR}/lumina-workshop-sdk-${SDK_VERSION}.tgz.sha256"
          gh release create "${TAG}" \
            "${TARBALL}" \
            "${CHECKSUM}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Lumina Workshop SDK ${SDK_VERSION}" \
            --notes "Immutable public SDK contract for Creative Workshop modules."
