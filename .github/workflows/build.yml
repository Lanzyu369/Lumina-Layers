name: Build Windows Desktop Release

on:
  pull_request:
    branches: [dev-refactor, main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-desktop-artifact:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-glb-v2.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            electron/pnpm-lock.yaml

      - name: Install Python release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          pip install -r requirements-glb-v2.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Electron dependencies
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Build formal Electron desktop release
        run: python scripts/build_desktop.py

      - name: Smoke frozen backend native relief kernel
        shell: pwsh
        run: |
          & dist/lumina-backend.exe `
            --desktop-native-kernel-smoke `
            --desktop-native-kernel-smoke-report desktop-native-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -Encoding UTF8 desktop-native-smoke.json
          $report = Get-Content -Raw -Encoding UTF8 desktop-native-smoke.json | ConvertFrom-Json
          if ($report.status -ne "ok") { throw "Frozen backend smoke did not pass" }
          if ($report.native_kernel -ne "manifold3d") { throw "manifold3d fast path missing" }
          if ($report.fallback_called) { throw "Frozen backend used Python fallback" }
          if (-not $report.board_watertight) { throw "Frozen backend Board is not watertight" }

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@v4
        with:
          name: lumina-studio-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            electron/dist_electron/*.exe
            dist/lumina-backend.exe
            desktop-native-smoke.json
