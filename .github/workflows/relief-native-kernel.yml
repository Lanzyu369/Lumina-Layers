name: SVG Relief Native Kernel

on:
  pull_request:
    branches: [dev-refactor, main]
  workflow_dispatch:

jobs:
  windows-fast-and-fallback:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-glb-v2.txt

      - name: Install runtime and native-kernel dependencies
        run: python -m pip install -r requirements.txt -r requirements-glb-v2.txt

      - name: Exercise native and forced-fallback relief kernels
        run: python -m pytest tests/test_vector_engine_mesh_weld_unit.py -q
