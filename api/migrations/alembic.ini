# Lumina Studio — Alembic migration configuration (Phase A4).
# Lumina Studio — Alembic 数据库迁移配置 (Phase A4).
#
# Run from repo root:
#   alembic -c api/migrations/alembic.ini upgrade head    # apply all
#   alembic -c api/migrations/alembic.ini downgrade -1    # roll back one
#   alembic -c api/migrations/alembic.ini current         # show current rev
#
# The connection URL is NOT hard-coded here; it is read at runtime from
# the LUMINA_DATABASE_URL environment variable by ``env.py``. This keeps
# the same alembic.ini valid across desktop dev / B2B / B2C deployments.
# 连接串不写死, 由 env.py 在运行时从 LUMINA_DATABASE_URL 读取, 保证
# 同一份配置可同时服务桌面 / B2B / B2C 三种部署.

[alembic]
script_location = .
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
version_path_separator = os
revision_environment = false

# sqlalchemy.url is intentionally left unset; see env.py.
# sqlalchemy.url 故意留空, 见 env.py 的 _resolve_database_url().

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
