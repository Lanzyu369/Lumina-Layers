<?xml version="1.0" encoding="UTF-8"?>
<!--
  Native SVG dynamic-material lifecycle fixture.

  The artwork deliberately combines preserved path geometry, a compound path,
  and a five-stop linear-gradient path.  It stays within the native
  large-format SVG subset: no images, masks, text, filters, or raster embeds.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="material-bands" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be444c"/>
      <stop offset="25%" stop-color="#c5c23b"/>
      <stop offset="50%" stop-color="#dbe0e5"/>
      <stop offset="75%" stop-color="#6b75ae"/>
      <stop offset="100%" stop-color="#33539a"/>
    </linearGradient>
  </defs>
  <path id="background" d="M0 0H120V80H0Z" fill="#dbe0e5"/>
  <path id="red-panel" d="M8 9H55V36H8Z" fill="#be444c"/>
  <path id="gradient-panel" d="M64 8C84 2 106 9 112 25C107 41 84 45 64 35Z" fill="url(#material-bands)"/>
  <path id="blue-ribbon" d="M10 48C26 39 46 42 57 56L48 71C34 58 23 59 10 68Z" fill="#33539a"/>
  <path id="yellow-ring" fill-rule="evenodd" d="M82 49A20 20 0 1 1 82 75A20 20 0 1 1 82 49ZM82 55A12 12 0 1 0 82 69A12 12 0 1 0 82 55Z" fill="#c5c23b"/>
</svg>
