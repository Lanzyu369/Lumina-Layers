[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -ra --strict-markers -m "not release"
faulthandler_timeout = 120
python_files = test_*.py
markers =
    asyncio: mark a test as asyncio-enabled.
    slow: marks tests as slow (deselect with '-m \"not slow\"')
    smoke: fast PR gate tests
    release: release-only long-running checks (e.g. perf timing); deselected by default, run with '-m release' or via scripts/run_full_tests.py
filterwarnings =
    ignore::DeprecationWarning
